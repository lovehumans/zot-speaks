name: Rust

# One job, one compile per push. The release is decided inside that same run:
# if the pushed commit carries a v* tag, the already-built binary is packaged
# and attached to that tag's GitHub Release. A separate tag trigger would
# start a second run that compiles the same commit a second time.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # checkout fetches with --no-tags by default: fetch-depth: 0 alone gives full
        # history but no tag refs, and the tag detection below then finds nothing (v1.7.4).
        fetch-tags: true
    # Cache the crate downloads and the compiled dependency graph. The key follows
    # Cargo.lock: while the lockfile is unchanged every run restores ~/.cargo (crate
    # files, sparse index) and target/ (compiled dependencies), so cargo re-downloads
    # nothing and re-compiles only this crate — checkout gives src/ fresh mtimes, but
    # the registry crates keep their cached mtimes and cargo considers them fresh.
    # Caches are repository-wide: main seeds them, PRs and later runs read them
    # (a branch can read caches from the default branch); unused caches expire in 7 days.
    - name: Cache cargo registry and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Build
      run: cargo build --release --verbose
    - name: Run tests
      run: cargo test --release --verbose
    - name: Detect a release tag on this commit
      id: tag
      run: |
        tag=$(git tag --points-at HEAD | grep '^v' | sort -V | tail -n1 || true)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    # The manifest travels as an asset next to the binary, and both are checksummed by the same
    # SHA256SUMS. zot reads extension.json at load (name, exec, commands, version), so an update
    # that swaps only the binary leaves an installation announcing a version it does not run; a
    # Release-based update can only carry the manifest if the Release publishes it.
    - name: Package the release binary and its manifest
      if: steps.tag.outputs.tag != ''
      run: |
        install -m 0755 target/release/zot-speaks zot-speaks
        sha256sum zot-speaks extension.json > SHA256SUMS
    # The text of the Release: the `## v<version>` section of CHANGELOG.md, which is the file
    # dev/publish.sh refuses to publish without. Falling back to build provenance keeps an old tag or
    # a hand-made tag releasable rather than failing the job.
    - name: Write the release notes from CHANGELOG.md
      if: steps.tag.outputs.tag != ''
      id: notes
      run: |
        tag="${{ steps.tag.outputs.tag }}"
        if [ -f CHANGELOG.md ]; then
          # Trailing blank lines trimmed. The tag is compared as a whole field so `v1.7.1` cannot
          # match the section belonging to `v1.7.10`.
          awk -v tag="$tag" '
            /^## / { keep = ($2 == tag); next }
            keep   { lines[++n] = $0 }
            END {
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
              first = 1
              while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
              for (i = first; i <= n; i++) print lines[i]
            }
          ' CHANGELOG.md > notes.md
        else
          : > notes.md
        fi
        if [ -s notes.md ]; then
          echo "found=yes" >> "$GITHUB_OUTPUT"
          echo "notes for $tag: $(wc -l < notes.md) lines from CHANGELOG.md"
        else
          echo "found=no" >> "$GITHUB_OUTPUT"
          echo "no CHANGELOG.md section for $tag; falling back to build provenance"
          printf 'Built with cargo build --release on ubuntu-latest by GitHub Actions.\n' > notes.md
        fi
    - name: Attach them to the tag's release
      if: steps.tag.outputs.tag != ''
      run: |
        tag="${{ steps.tag.outputs.tag }}"
        {
          cat notes.md
          printf '\nAssets, verified by `just update-release`:\n\n%s\n' "$(cat SHA256SUMS)"
        } > NOTES
        if gh release view "$tag" >/dev/null 2>&1; then
          echo "release $tag already exists; refreshing its assets"
          if [ "${{ steps.notes.outputs.found }}" = yes ]; then
            gh release edit "$tag" --notes-file NOTES
          fi
        else
          gh release create "$tag" --title "zot-speaks $tag" --notes-file NOTES
        fi
        gh release upload "$tag" zot-speaks extension.json SHA256SUMS --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
