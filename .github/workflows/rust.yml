name: Rust

# One job, one compile per push. The release is decided inside that same run:
# if the pushed commit carries a v* tag, the already-built binary is packaged
# and attached to that tag's GitHub Release. A separate tag trigger would
# start a second run that compiles the same commit a second time.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # checkout fetches with --no-tags by default: fetch-depth: 0 alone gives full
        # history but no tag refs, and the tag detection below then finds nothing (v1.7.4).
        fetch-tags: true
    # Cache the crate downloads and the compiled dependency graph. The key follows
    # Cargo.lock: while the lockfile is unchanged every run restores ~/.cargo (crate
    # files, sparse index) and target/ (compiled dependencies), so cargo re-downloads
    # nothing and re-compiles only this crate — checkout gives src/ fresh mtimes, but
    # the registry crates keep their cached mtimes and cargo considers them fresh.
    # Caches are repository-wide: main seeds them, PRs and later runs read them
    # (a branch can read caches from the default branch); unused caches expire in 7 days.
    - name: Cache cargo registry and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Build
      run: cargo build --release --verbose
    - name: Run tests
      run: cargo test --release --verbose
    - name: Detect a release tag on this commit
      id: tag
      run: |
        tag=$(git tag --points-at HEAD | grep '^v' | sort -V | tail -n1 || true)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Package the release binary
      if: steps.tag.outputs.tag != ''
      run: |
        install -m 0755 target/release/zot-speaks zot-speaks
        sha256sum zot-speaks > SHA256SUMS
    - name: Attach it to the tag's release
      if: steps.tag.outputs.tag != ''
      run: |
        tag="${{ steps.tag.outputs.tag }}"
        sha=$(cut -d' ' -f1 SHA256SUMS)
        printf 'Built with cargo build --release on ubuntu-latest by GitHub Actions.\n\nsha256: %s\n' "$sha" > NOTES
        if gh release view "$tag" >/dev/null 2>&1; then
          echo "release $tag already exists; refreshing its assets instead of failing"
        else
          gh release create "$tag" --title "zot-speaks $tag" --notes-file NOTES
        fi
        gh release upload "$tag" zot-speaks SHA256SUMS --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
